name: Attest SBOM
description: Attach a SBOM to a container image as a Cosign attestation. Requires id-token:write permission in the calling job.

inputs:
  image-ref:
    description: Fully qualified image reference including digest (e.g. 123456.dkr.ecr.us-east-1.amazonaws.com/my-image@sha256:abc123). Refused unless it is <registry>/<repository>@sha256:<64 hex>.
    required: true
  sbom-file:
    description: Path to the SBOM file to attach. Must be an existing regular file under RUNNER_TEMP or GITHUB_WORKSPACE.
    required: true
  sbom-type:
    description: SBOM predicate type — cyclonedx, spdx or spdxjson.
    required: false
    default: cyclonedx

runs:
  using: composite
  steps:
    # 🔴 INPUTS ARE DATA (see sign/action.yml). Checked before cosign is even installed.
    - name: Check inputs
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        SBOM_FILE: ${{ inputs.sbom-file }}
        SBOM_TYPE: ${{ inputs.sbom-type }}
      run: |
        set -euo pipefail
        # A registry path, then @sha256:<64 hex>. Nothing else can reach cosign.
        if ! [[ "$IMAGE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]{0,255}@sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::image-ref must be <registry>/<repository>@sha256:<64 hex>, a digest reference"
          exit 1
        fi
        case "$SBOM_TYPE" in
          cyclonedx|spdx|spdxjson) ;;
          *) echo "::error::sbom-type must be cyclonedx, spdx or spdxjson"; exit 1 ;;
        esac
        case "$SBOM_FILE" in
          -*|"") echo "::error::sbom-file must be a path, not empty or an option"; exit 1 ;;
        esac
        if [ ! -f "$SBOM_FILE" ] || [ -L "$SBOM_FILE" ]; then
          echo "::error::sbom-file must be an existing regular file (not a symlink)"
          exit 1
        fi
        # The file becomes a PUBLIC attestation (the registry and Sigstore's transparency
        # log), so it must be one this job made: under RUNNER_TEMP or GITHUB_WORKSPACE, after
        # every symlink and `..` is resolved. Not ~/.docker/config.json, which hosted runners
        # ship with a login in it.
        real="$(realpath -- "$SBOM_FILE")"
        inside=false
        for base in "${RUNNER_TEMP:-}" "${GITHUB_WORKSPACE:-}"; do
          [ -n "$base" ] || continue
          b="$(realpath -- "$base" 2>/dev/null)" || continue
          case "$real" in "$b"/*) inside=true ;; esac
        done
        if [ "$inside" != true ]; then
          echo "::error::sbom-file must be under RUNNER_TEMP or GITHUB_WORKSPACE (it resolves to $real)"
          exit 1
        fi

    - name: Install Cosign
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1, what @v3 resolved to on 2026-11-20

    - name: Attest SBOM
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "1"
        IMAGE_REF: ${{ inputs.image-ref }}
        SBOM_FILE: ${{ inputs.sbom-file }}
        SBOM_TYPE: ${{ inputs.sbom-type }}
      run: |
        set -euo pipefail
        cosign attest --yes \
          --predicate "$SBOM_FILE" \
          --type "$SBOM_TYPE" \
          "$IMAGE_REF"
        echo "✓ SBOM attested: $IMAGE_REF"
