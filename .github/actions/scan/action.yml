name: Trivy CVE Scan
description: Scan a container image for vulnerabilities with Trivy. Fails on findings at or above the severity threshold.

inputs:
  image-ref:
    description: Image to scan (e.g. test-image:26.5.0)
    required: true
  severity:
    description: Comma-separated severity levels that fail the build.
    required: false
    default: HIGH,CRITICAL
  exit-code:
    description: Exit code when vulnerabilities are found. Set "0" to report-only.
    required: false
    default: "1"
  ignore-unfixed:
    description: Ignore vulnerabilities with no available fix.
    required: false
    default: "true"
  trivy-version:
    description: Trivy version to install.
    required: false
    default: "0.70.0"

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${{ inputs.trivy-version }}/trivy_${{ inputs.trivy-version }}_Linux-ARM64.tar.gz" \
          | tar -xz trivy
        sudo mv trivy /usr/local/bin/trivy
        trivy --version

    - name: Scan image
      shell: bash
      run: |
        trivy image \
          --exit-code ${{ inputs.exit-code }} \
          --severity "${{ inputs.severity }}" \
          --ignore-unfixed=${{ inputs.ignore-unfixed }} \
          --format table \
          "${{ inputs.image-ref }}"
