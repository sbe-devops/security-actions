name: Trivy CVE Scan
description: Scan a container image for vulnerabilities with Trivy. Fails on findings at or above the severity threshold.

inputs:
  image-ref:
    description: Image to scan (e.g. test-image:26.5.0)
    required: true
  severity:
    description: Comma-separated severity levels that fail the build.
    required: false
    default: HIGH,CRITICAL
  exit-code:
    description: Exit code when vulnerabilities are found. Set "0" to report-only.
    required: false
    default: "1"
  ignore-unfixed:
    description: Ignore vulnerabilities with no available fix.
    required: false
    default: "true"
  sarif-file:
    description: Path to write the SARIF output file.
    required: false
    default: trivy-results.sarif

runs:
  using: composite
  steps:
    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: sarif
        output: ${{ inputs.sarif-file }}
        exit-code: ${{ inputs.exit-code }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}

    - name: Upload SARIF to GitHub Security tab
      if: ${{ !cancelled() && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
