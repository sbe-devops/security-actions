# A string literal into a number input is a REAL type error ("typed as number … string value
# cannot be assigned"), not the quoted-bool false positive: the literal-type filter must not drop it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  not-a-number:
    uses: ./.github/workflows/callee.yml
    with:
      count: "abc"
